name: docs

# Read the Docs builds and publishes the documentation itself - the webhook fires on push and
# .readthedocs.yaml is the whole deployment. This workflow does NOT deploy anything. It exists
# because RTD only tells you about a problem after the push has landed, and it is configured
# with fail_on_warning: false, so a heading whose anchor stopped matching, a figure that was
# never committed, or a doxygen input that moved all render as a broken page rather than a
# failed build.
#
# So this runs the same steps RTD runs, with warnings promoted to errors, before merge.
# Keep the steps here in step with .readthedocs.yaml - if they drift, a green check here stops
# meaning anything about what RTD will do.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # doxygen generates the xml that breathe reads for the C++ and C api pages. Same package
      # .readthedocs.yaml installs through apt_packages.
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install python requirements
        run: pip install -r docs/requirements.txt

      # The three pre_build jobs from .readthedocs.yaml, in the same order.
      - name: Doxygen
        run: doxygen Doxyfile

      - name: Preprocess users manual
        run: |
          python docs/preprocess_manual.py \
            documentation/pestpp_users_manual.md docs/users_manual_processed.md

      - name: Stage manual media
        run: |
          mkdir -p docs/media
          cp -r documentation/media/. docs/media/

      # Not -W, because these classes of warning cannot be fixed and cannot be silenced.
      # Instead every OTHER warning is an error, which is the gate -W was wanted for.
      #
      # Counts below are from a tracked-files-only tree built with what this job installs -
      # apt doxygen 1.9.8 on ubuntu-24.04, and sphinx 9.1 / breathe 4.36 / myst 5.1 from the
      # unpinned docs/requirements.txt. 98 warnings, all four classes, nothing else.
      #
      # The exempt classes:
      #
      #   Duplicate C++ declaration (90) - breathe emits an entity from both the header that
      #   declares it and the .cpp that defines it. Documenting only one file does not fix it,
      #   it just loses documentation: dropping the .cpp costs 108 pest_utils free functions
      #   (check_exist_in, read_binary, tokenize ...), because doxygen files a free function
      #   under its definition and the header never emits it; dropping the .h costs 4427
      #   entities, nearly everything, because that is where the classes live. Measured both
      #   ways. sphinx logs this one with no `type=`, so suppress_warnings cannot reach it.
      #
      #   Invalid C++ declaration (6), and one "Parsing of expression failed, using fallback
      #   parser" - `friend`, two template signatures and a lambda used as a default value,
      #   none of which sphinx's own C++ parser will read. The code is valid; the parser is
      #   the limit, and it degrades to a fallback rather than losing the entity.
      #
      #   Duplicate explicit target name (1) - "namespacepest__utils", for the same reason:
      #   the namespace gets a link target from both files that contribute to it. `:no-link:`
      #   on one of them silences it and takes 54 entities with it.
      #
      #   Error in type declaration, capi.rst only (0 today) - the observer callback typedef.
      #   doxygen 1.9.8 does not emit this; 1.18 renders `typedef int (*pestpp_run_observer_fn)
      #   (...)` back out as `int(*) pestpp_run_observer_fn (...)`, which the C++ parser will
      #   not take. Exempted ahead of the day apt moves to a newer doxygen, so that upgrade
      #   does not turn this job red on its own. The real fix is breathe parsing that header
      #   in the C domain, which cannot be scoped to one file - breathe_domain_by_extension
      #   keys off the extension and every C++ header here is also .h. Pinned to capi.rst so
      #   a type error anywhere else still fails.
      #
      # Anything else - a missing doxygen input, a broken include, a document not in any
      # toctree, a dead reference - fails the job. Verified in both directions: clean on a
      # tracked-files-only tree, and it does catch an undefined label injected on purpose.
      - name: Sphinx build
        run: |
          set -o pipefail
          sphinx-build -b html docs docs/_build/html 2>&1 | tee sphinx.log

          # these warnings are two lines; the continuation carries no WARNING: so only the
          # first line is ever counted
          unexpected=$(grep 'WARNING:' sphinx.log \
                       | grep -v 'Duplicate C++ declaration' \
                       | grep -v 'Invalid C++ declaration' \
                       | grep -v 'Parsing of expression failed' \
                       | grep -v 'Duplicate explicit target name: "namespacepest__utils"' \
                       | grep -v 'capi\.rst:[0-9]*: WARNING: Error in type declaration' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::sphinx reported warnings that are not the known breathe/parser noise"
            echo "$unexpected"
            exit 1
          fi
          echo "no unexpected warnings"

      # Handy when the build fails on something layout-related and the log is not enough.
      - name: Upload rendered html
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: warn
