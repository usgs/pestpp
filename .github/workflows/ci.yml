name: continuous integration

on: 
  schedule:
    - cron: '0 8 * * *' # run at 8 AM UTC (12 am PST)
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pestppCI:
    name: benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not in the cross-product: it runs only a curated subset via `include`
        # below (basic + ies part1), not the full env list that win/linux run.
        os: [windows-latest, ubuntu-latest]
        # python-version: ["3.10"] # , 3.7, 3.6]
        run-type: [std]
        # test_repo: [""]
        # test_dir: [""]
        # test_script: [""]
        # include:
        #   - test_script: opt_test.py
        #   - test_repo: "https://github.com/pestpp/pestpp-opt_benchmarks"
        #   - test_dir: "pestpp-opt_benchmarks"
        
        env:
          - { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "basic_tests.py"}
          # drives the shared library through the C ABI - the only tests that exercise the
          # api, rather than the executables running the built-in loop
          - { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "capi_tests.py"}
          # the ergonomic layer on top of it, plus executing the example notebook so a stale
          # cell fails here rather than in front of a new user
          - { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "pestpp_api_tests.py"}
          # runs each tool BOTH ways - executable and api - on one control file and diffs the
          # output. The only tests that can catch an adapter quietly taking a different path
          # through a tool; everything else judges the api against itself
          - { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "api_vs_exe_tests.py"}
          # cross-platform reproducibility: one analytic model (g07) driven through ies, da,
          # sqp, mou and opt via the external run manager, compared against a committed
          # baseline.  Its own entry so a divergence names the tool it came from.
          - { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "basic_tests.py:basic_xplat_g07_test"}
          - { test_dir: "pestpp-opt_benchmarks", test_repo: "https://github.com/pestpp/pestpp-opt_benchmarks", test_script: "../benchmarks/opt_test.py"}
          - { test_dir: "pestpp-ies_benchmarks", test_repo: "https://github.com/pestpp/pestpp-ies_benchmarks", test_script: "../benchmarks/ies_test_base.py"}
          - { test_dir: "pestpp-ies_benchmarks", test_repo: "https://github.com/pestpp/pestpp-ies_benchmarks", test_script: "../benchmarks/ies_test_part1.py"}
          - { test_dir: "pestpp-ies_benchmarks", test_repo: "https://github.com/pestpp/pestpp-ies_benchmarks", test_script: "../benchmarks/ies_test_part2.py"}
          - { test_dir: "pestpp-ies_benchmarks", test_repo: "https://github.com/pestpp/pestpp-ies_benchmarks", test_script: "../benchmarks/ies_test_part3.py"}
          - { test_dir: "pestpp-ies_benchmarks", test_repo: "https://github.com/pestpp/pestpp-ies_benchmarks", test_script: "../benchmarks/ies_test_part4.py"}
          - { test_dir: "pestpp-glm_benchmarks", test_repo: "https://github.com/pestpp/pestpp-glm_benchmarks", test_script: "../benchmarks/glm_test_base.py"}
          - { test_dir: "pestpp-mou_benchmarks", test_repo: "https://github.com/pestpp/pestpp-mou_benchmarks", test_script: "../benchmarks/mou_tests.py"}
          - { test_dir: "pestpp-mou_benchmarks", test_repo: "https://github.com/pestpp/pestpp-mou_benchmarks", test_script: "../benchmarks/mou_ppd_fitness_tests.py"}
          - { test_dir: "pestpp-mou_benchmarks", test_repo: "https://github.com/pestpp/pestpp-mou_benchmarks", test_script: "../benchmarks/henry_test.py"}
          - { test_dir: "pestpp-da_benchmarks", test_repo: "https://github.com/pestpp/pestpp-da_benchmarks", test_script: "../benchmarks/da_tests.py"}
          - { test_dir: "pestpp-sqp_benchmarks", test_repo: "https://github.com/pestpp/pestpp-sqp_benchmarks", test_script: "../benchmarks/sqp_test_part1.py"}
          - { test_dir: "pestpp-sqp_benchmarks", test_repo: "https://github.com/pestpp/pestpp-sqp_benchmarks", test_script: "../benchmarks/sqp_test_part2.py"}
          - { test_dir: "pestpp-mou_benchmarks", test_repo: "https://github.com/pestpp/pestpp-mou_benchmarks", test_script: "../benchmarks/mou_tests_2.py"}
        include:
            - os: ubuntu-latest
              env: { test_dir: "benchmarks", test_repo: "https://github.com/pestpp/pestpp-da_benchmarks", test_script: "../benchmarks/lorenz96_tests.py"}
            # macOS runs only the basic benchmarks and ies part1 tests
            - os: macos-latest
              env: { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "basic_tests.py"}
            - os: macos-latest
              env: { test_dir: "pestpp-ies_benchmarks", test_repo: "https://github.com/pestpp/pestpp-ies_benchmarks", test_script: "../benchmarks/ies_test_part1.py"}
            # the C ABI is worth running on all three: how the shared library is named,
            # linked and loaded differs per platform, and these tests are quick
            - os: macos-latest
              env: { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "capi_tests.py"}
            - os: macos-latest
              env: { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "pestpp_api_tests.py"}
            - os: macos-latest
              env: { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "api_vs_exe_tests.py"}
            # the reproducibility check earns its place on all three platforms - that is the
            # entire point of it
            - os: macos-latest
              env: { test_dir: "benchmarks", test_repo: "https://github.com/usgs/pestpp", test_script: "basic_tests.py:basic_xplat_g07_test"}
    env: ${{ matrix.env }}

    steps:
      - uses:  actions/checkout@v6

    # - name: Cache Miniconda
    #   uses: actions/cache@v2.1.0
    #   env:
    #     # Increase this value to reset cache if environment.yml has changed
    #     CACHE_NUMBER: 0
    #   with:
    #     path: ~/conda_pkgs_dir
    #     key: ${{ runner.os }}-${{ matrix.run-type }}-${{ env.CACHE_NUMBER }}-${{ hashFiles('etc/environment.yml') }}

      - name: Set Windows ENV
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

    # Standard python fails on windows without GDAL installation
    # Using custom bash shell ("shell: bash -l {0}") with Miniconda
    # - name: Setup Miniconda
    #   uses: conda-incubator/setup-miniconda@v2
    #   with:
    #     # python-version: ${{ matrix.python-version }}
    #     # #mamba-version: "0.20.0"
    #     # channels: conda-forge
    #     # auto-update-conda: true
    #     # activate-environment: pyemu
    #     # use-only-tar-bz2: true
    #     miniforge-version: latest
    #     # miniconda-version: "latest"
    #     python-version: ${{ matrix.python-version }}
    #     # mamba-version: "*"
    #     # channels: conda-forge
    #     miniforge-variant: Mambaforge
    #     # auto-update-conda: true
    #     activate-environment: pyemu
    #     use-mamba: true
    #     # environment-file: etc/environment.yml
    #     # use-only-tar-bz2: true

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: etc/environment.yml
          cache-environment: false
          post-cleanup: 'all'

    # - name: Add packages to pyemu environment using mamba or conda
    #   shell: bash -l {0}
    #   run: |
    #     if [ "$RUNNER_OS" == "Windows" ]; then
    #       conda env update --name pyemu --file etc/environment.yml
    #     else
    #       conda env update --name pyemu --file etc/environment.yml
    #     fi

    # - name: Add packages to pyemu environment using conda
    #   if: ${{ matrix.python-version < 3.8 }}
    #   # if: ${{ runner.os == 'Windows' || matrix.python-version < 3.8 }}
    #   shell: bash -l {0}
    #   run: |
    #       conda env update --name pyemu --file etc/environment.yml
    
    # - name: Add packages to pyemu environment using mamba
    #   # if: ${{ runner.os != 'Windows' && matrix.python-version >= 3.8 }}
    #   if: ${{ matrix.python-version >= 3.8 }}
    #   shell: bash -l {0}
    #   run: |
    #       mamba env update --name pyemu --file etc/environment.yml
    
    # - name: Install Flopy & pyemu?
    #   shell: bash -l {0}
    #   run: |
    #     # git clone -b develop --depth 1 https://github.com/modflowpy/flopy.git
    #     # cd flopy
    #     # python setup.py install
    #     # cd ..
    #     # pip install https://github.com/modflowpy/pymake/zipball/master
    #     git clone -b develop --depth 1 https://github.com/pypest/pyemu.git
    #     cd pyemu
    #     python setup.py install
    #     cd ..

    # - name: Get specific version CMake, v3.19
    #   if: ${{ runner.os == 'Windows' }} 
    #   uses: lukka/get-cmake@latest

      - name: clone test repo ${{ env.test_repo }}
        shell: bash -l {0}
        run: |
          git clone ${{ env.test_repo }}

      - name: PESTPP exe install
        shell: bash -l {0}
        run: |
          mkdir build && cd build
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              cmake -GNinja -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=Release ..
              ninja
          else
              cmake -DCMAKE_BUILD_TYPE=Release ..
              make -j2
          fi
          cd ..

      - name: option-system self-test
        shell: bash -l {0}
        run: |
          bin=$(find build -type f \( -name 'pestpp-selftest' -o -name 'pestpp-selftest.exe' \) | head -1)
          echo "running $bin"
          "$bin"

      - name: public API surface check
        shell: bash -l {0}
        run: |
          python3 scripts/check_public_surface.py

      # Put the model binaries (mfnwt, mf6, ...) on PATH for the forward runs.
      #
      # These entries are ABSOLUTE on purpose. This step used to add "../../test_bin/<plat>",
      # which is relative and so resolves against whatever directory the *model* process runs
      # in - meaning it only worked for case directories exactly two levels below the test
      # directory. That happened to be true of every benchmark script, so the constraint was
      # invisible until a test used a different depth and got "execv() failed for command:
      # mfnwt" on linux only (macOS masked it via $HOME/bin, windows via CreateProcess also
      # searching the current directory). Absolute entries make depth irrelevant.
      #
      # Two directories are needed, because they hold different things:
      #   <test_dir>/test_bin/<plat>  - each cloned benchmark repo ships its own binaries
      #   benchmarks/test_bin/<plat>  - this repo's, and the ONLY source of macOS binaries
      #                                 (the benchmark repos ship linux and win only)
      - name: model binary path
        shell: bash -l {0}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              plat=win
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
              plat=mac
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
              plat=linux
          else
              echo "::error::Unrecognized RUNNER_OS '$RUNNER_OS' - no test_bin available for this runner"
              exit 1
          fi

          # Strict fallback, not both: when a benchmark repo ships its own binaries they must
          # be the ones used, exactly as before. benchmarks/test_bin is consulted only when
          # the test directory has nothing for this platform, which is every macOS job except
          # the one whose test_dir is benchmarks itself.
          own="$GITHUB_WORKSPACE/${test_dir}/test_bin/$plat"
          fallback="$GITHUB_WORKSPACE/benchmarks/test_bin/$plat"
          if [[ -d "$own" ]]; then
              model_bin="$own"
          elif [[ -d "$fallback" ]]; then
              model_bin="$fallback"
          else
              echo "::error::no test_bin/$plat found for test_dir '${test_dir}' (looked in $own and $fallback)"
              exit 1
          fi
          echo "model binary path: $model_bin"
          ls "$model_bin"
          echo "$model_bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: run test script ${{ env.test_script }} in ${{ env.test_dir }}
        shell: bash -l {0}
        run: |
          ls -l
          cd ${{ env.test_dir }}
          nosetests -v ${{ env.test_script }}
          status=$?
          echo $status

          if [ $status -eq 0 ]; then
              exit 0
          else
              exit 127
          fi
